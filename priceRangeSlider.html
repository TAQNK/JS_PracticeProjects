<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        padding: 0;
        margin: 0;
      }
      body {
        background: #dadada;
        height: 100vh;
        display: flex;
      }
      .container {
        width: 400px;
        background: #9c1313;
        box-shadow: 1px 0px 5px black;
        margin: auto;
        border-radius: 14px;
        color: white;
      }
      .card {
        padding: 10px;
        text-align: center;
        height: 200px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .card .Price {
        display: flex;
        gap: 10px;
        justify-content: space-around;
        font-size: 14px;
      }
      .slider {
        height: 5px;
        width: 100%;
        background: #000;
        position: relative;
      }
      .fill{
        width: 40%;
        height: 5px;
        background-color: aquamarine;
       float: left;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Price Slider</h1>
        <div class="Price">
          <h3>Minimum Price</h3>
          <input type="number" />
        </div>
        <div class="Price">
          <h3>Minimum Price</h3>
          <input type="number" />
        </div>
        <div class="slider">
          <div class="fill"></div>
        </div>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        body{
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: black;
        }
        .container{
            margin: auto;
            background: linear-gradient(red , black);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 3px 0px 15px red;
            color: white;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        input{
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-size: 10px;
            width: 150px;
        }
        .footer {
            background-color: white;
            color: black;
            border-radius: 10px;
            padding: 10px;
            height: 30px;
            width: 250px;
             background-color: aquamarine;
             margin: auto;
             
        }
        .footer h2{
            width: 100%;
            font-size: 10px;
            overflow: scroll;
            scrollbar-width: none;
           
        }
        .user-form{
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .submitBtn{
            background:linear-gradient(blue,white);
            border-radius: 10px;
            height: 40px;
            border: none;
            font-size: 10px;
            width: fit-content;
            padding: 10px;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>User Form</h2>
        </div>
         <form class="user-form" id="form">
        <input type="text" placeholder="Enter your name" class="input" id="name">
        <input type="password" placeholder="Password" class="input" id="password">
        <button class="submitBtn">Login</button>
    </form>
    
    </div>
    <div class="footer">
        <h2 id="userText"></h2>
    </div>
   
</body>
<script>
    const userName = document.getElementById("name");
    const password = document.getElementById("password");
    const userText = document.getElementById("userText");
    // userName.addEventListener("keyup" , () => {
    //     userText.innerText = userName.value;    
    // })


    const form = document.getElementById("form");
    
    form.addEventListener("submit",(e)=>{
        e.preventDefault();
        let userData = {};
        userData.name = userName.value;
        userData.password = password.value;
        console.log(userData);

        userText.innerText = JSON.stringify(userData);
    })
</script>
</html>
